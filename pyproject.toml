[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "refcheck"
version = "0.1.0"
description = "AI-powered scientific reference verification for biomedical manuscripts"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.10.0",
    "sqlmodel>=0.0.22",
    "python-docx>=1.1.0",
    "lxml>=5.0.0",
    "PyMuPDF>=1.24.0",
    "rapidfuzz>=3.10.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "diskcache>=5.6.0",
    "litellm>=1.50.0",
    "jinja2>=3.1.0",
    "sse-starlette>=2.0.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# B008: Depends() in default args is standard FastAPI dependency injection
"src/refcheck/api/routes/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["refcheck"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = [
    "diskcache.*",
    "litellm.*",
    "docx.*",
    "lxml.*",
    "fitz.*",
    "rapidfuzz.*",
    "sse_starlette.*",
    "aiofiles.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "e2e: marks end-to-end tests",
    "canary: marks LLM grounding canary tests",
    "live: marks tests requiring live API keys",
]

[tool.setuptools.packages.find]
where = ["src"]
